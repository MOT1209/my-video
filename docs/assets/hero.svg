<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">my-video</title>
  <desc id="d">Vertical 9:16 Shorts generator: hook and scenes become a narrated video with word-by-word captions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="0.55" stop-color="#150d2b"/>
      <stop offset="1" stop-color="#2a1458"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1236"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="'Segoe UI','Noto Sans Arabic','Noto Kufi Arabic',Arial,sans-serif">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <circle cx="1000" cy="210" r="320" fill="url(#glow)"/>
    <circle cx="140" cy="40" r="220" fill="url(#glow)" opacity="0.35"/>

    <!-- text block -->
    <text x="90" y="170" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">my-video</text>
    <rect x="94" y="192" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="92" y="244" font-size="28" fill="#d9d2f2">Vertical Shorts, from text to video</text>
    <text x="92" y="286" font-size="24" fill="#a99fd0">فيديوهات عمودية من النص إلى الفيديو</text>

    <!-- chips -->
    <g font-size="15" font-weight="600" fill="#ffffff">
      <rect x="92" y="324" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="144" y="346" text-anchor="middle">Remotion</text>
      <rect x="208" y="324" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="256" y="346" text-anchor="middle">Next.js</text>
      <rect x="316" y="324" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="368" y="346" text-anchor="middle">Edge-TTS</text>
      <rect x="432" y="324" width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="506" y="346" text-anchor="middle">Vercel Sandbox</text>
    </g>

    <!-- waveform -->
    <g fill="url(#accent)" opacity="0.85">
      <rect x="640" y="190" width="8" height="40" rx="4"/>
      <rect x="658" y="170" width="8" height="80" rx="4"/>
      <rect x="676" y="150" width="8" height="120" rx="4"/>
      <rect x="694" y="176" width="8" height="68" rx="4"/>
      <rect x="712" y="196" width="8" height="28" rx="4"/>
      <rect x="730" y="164" width="8" height="92" rx="4"/>
      <rect x="748" y="140" width="8" height="140" rx="4"/>
      <rect x="766" y="172" width="8" height="76" rx="4"/>
      <rect x="784" y="194" width="8" height="32" rx="4"/>
    </g>

    <!-- phone -->
    <g transform="translate(900 40)">
      <rect x="-6" y="-6" width="232" height="352" rx="30" fill="#ffffff" fill-opacity="0.06"/>
      <rect width="220" height="340" rx="26" fill="url(#screen)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
      <rect x="70" y="12" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <text x="110" y="92" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">ثلاث حقائق ستغير</text>
      <text x="110" y="120" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">طريقة تفكيرك</text>
      <rect x="24" y="162" width="172" height="74" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="110" y="205" text-anchor="middle" font-size="15" fill="#ffffff">عقلك يركز على ما تكرره</text>
      <rect x="44" y="270" width="64" height="26" rx="8" fill="#a78bfa"/>
      <rect x="114" y="270" width="62" height="26" rx="8" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="24" y="314" width="172" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="24" y="314" width="76" height="6" rx="3" fill="#a78bfa"/>
    </g>
  </g>
</svg>
