  tl.set("#f14-siren", { opacity: 0.85 }, 2.2);
  // "Assume" — receipt clears, AGENT drops in, sealed in a quarantine box
  tl.to(["#f14-rn", "#f14-ms", "#f14-xpost"], { y: -760, duration: 0.2, ease: "power2.in" }, 2.46);
  tl.set(["#f14-rn", "#f14-ms", "#f14-xpost"], { opacity: 0 }, 2.67);
  tl.set("#f14-qbox", { opacity: 1 }, 2.5);
  tl.to("#f14-qbox", { y: 0, duration: 0.32, ease: "bounce.out" }, 2.52);
  KIT.shake(tl, "#f14-cam", 2.84, 16, 0.3, 27);
  KIT.face(tl, "f14-qag", "shock", 2.62);
  KIT.pose(tl, "f14-qag", "shrug", 2.66, 0.14);
  KIT.talk(tl, "f14-qag", KIT.wordsIn(T0, T1).map((w) => w.s).filter(inR(0, 5.6)));
  KIT.sweat(tl, "f14-qag", 3.0);
  // "compromised" — tape wraps the box
  tl.set("#f14-tape1", { opacity: 1 }, 3.52);
  tl.to("#f14-tape1", { scaleX: 1, duration: 0.18, ease: "power3.out" }, 3.52);
  tl.set("#f14-tape2", { opacity: 1 }, 3.7);
  tl.to("#f14-tape2", { scaleX: 1, duration: 0.18, ease: "power3.out" }, 3.7);
  KIT.shake(tl, "#f14-cam", 3.58, 10, 0.2, 8);
  KIT.face(tl, "f14-qag", "nervous", 3.6);
  KIT.pose(tl, "f14-qag", "cover", 3.62, 0.18);
  // "?!"
  pop("#f14-huh", 4.2, { s0: 2.4, r0: 20, r1: 8, d: 0.22 });
  KIT.face(tl, "f14-qag", "shock", 4.24);
  KIT.pose(tl, "f14-qag", "hype", 4.24, 0.14);
  // "man, that's a lot to take" — dizzy X eyes, stars orbiting
  KIT.face(tl, "f14-qag", "sad", 4.5);
  KIT.pose(tl, "f14-qag", "down", 4.5, 0.25);
  KIT.face(tl, "f14-qag", "dead", 5.12);
  tl.set(".f14-dz", { opacity: 1 }, 5.1);
  [5.12, 5.3, 5.48].forEach((t, i) => tl.to("#f14-qag-head", { rotation: i % 2 ? 9 : -9, duration: 0.17, ease: "sine.inOut" }, t));
  KIT.groove(tl, "f14-qag", beats.filter(inR(2.9, 3.5)), 0.6);
  KIT.blink(tl, "f14-qag", 4.0);
  // dizzy stars: pure function of time
  KIT.onFrame(tl, (t) => {
    const on = t >= 5.1 && t < 5.7;
    for (let i = 0; i < 3; i++) {
      const a = (t - 5.1) * 9 + (i * Math.PI * 2) / 3, el = document.getElementById("f14-dz" + i);
      if (!el) continue;
      el.style.transform = on ? `translate(${790 - 35 + Math.cos(a) * 200}px, ${436 - 35 + Math.sin(a) * 48}px) scale(${0.8 + 0.25 * Math.sin(a)})` : "translate(-200px,-200px)";
      el.style.zIndex = Math.sin(a) > 0 ? 3 : 1;
    }
  });

  /* ============ SUNDAY — "I read the fine print: come November, y'all be nice" ============ */
  tl.set("#f14-sU", { opacity: 1 }, 5.62);
  tl.set("#f14-fgS", { opacity: 0 }, 5.62);
  tl.set("#f14-bgS", { opacity: 0 }, 5.62);
  KIT.flash(tl, "#f14-flash", 5.64, 0.6, 0.25);
  tl.set("#f14-calU", { scale: 1.7, rotation: -18, transformOrigin: "50% 40%" }, 5.62);
  tl.to("#f14-calU", { scale: 0.8, rotation: -5, duration: 0.24, ease: "back.out(2.2)" }, 5.64);
  KIT.shake(tl, "#f14-cam", 5.68, 16, 0.3, 19);
  tl.set("#f14-ru", { y: 900, rotation: 3 }, 0);
  tl.set("#f14-ru .k-mark", { scaleX: 0 }, 0);
  tl.set(".f14-glassL .k-mark", { scaleX: 0 }, 0);
  tl.to("#f14-ru", { y: 0, rotation: -1.5, duration: 0.34, ease: "back.out(1.3)" }, 5.74);
  // magnifier: lens centre in receipt coords (lx, ly); its glass content moves in lockstep
  const lensAt = (lx, ly) => ({ x: lx, y: ly });
  const lensIn = (lx, ly) => ({ x: -500 * M + RIN - (lx * MAG), y: -270 * M + RIN - ((ly - 50) * MAG) });
  const P0 = [760, 980], P1 = [330, 624], P2 = [520, 624], P3 = [358, 666];
  const moveLens = (from, to, t, d, ease) => {
    tl.to("#f14-lens", Object.assign(lensAt(to[0], to[1]), { duration: d, ease }), t);
    tl.to("#f14-lens-in", Object.assign(lensIn(to[0], to[1]), { duration: d, ease }), t);
  };
  tl.set("#f14-lens", Object.assign({ opacity: 0 }, lensAt(P0[0], P0[1])), 0);
  tl.set("#f14-lens-in", lensIn(P0[0], P0[1]), 0);
  tl.set("#f14-lens", { opacity: 1 }, 6.0);
  moveLens(P0, P1, 6.0, 0.55, "power3.out");        // "I ... read"
  moveLens(P1, P2, 6.7, 0.5, "sine.inOut");          // reading across "abusive behavior toward our models"
  tl.to(["#f14-ru-mark0", "#f14-lm0"], { scaleX: 1, duration: 0.5, ease: "sine.inOut" }, 6.7);
  // "fine print" — the quote card lands on the stop
  tl.set("#f14-quote", { opacity: 1, x: 900, rotation: 6 }, 7.12);
  tl.to("#f14-quote", { x: 0, rotation: 2, duration: 0.26, ease: "back.out(1.6)" }, 7.12);
  // "come November" — lens drops to the date, stamp slams
  moveLens(P2, P3, 7.74, 0.26, "power3.inOut");
  tl.to(["#f14-ru-mark1", "#f14-lm1"], { scaleX: 1, duration: 0.24, ease: "power2.inOut" }, 7.96);
  tl.set("#f14-stamp", { opacity: 1, scale: 3, rotation: 4 }, 7.96);
  tl.to("#f14-stamp", { scale: 1, rotation: -8, duration: 0.14, ease: "power4.in" }, 7.961);
  KIT.shake(tl, "#f14-cam", 8.1, 18, 0.3, 23);
  // "y'all be nice"
  pop("#f14-nice", 8.84, { s0: 0.1, r0: -60, r1: -10, d: 0.32 });
  KIT.punch(tl, "#f14-stamp", 8.55, 1.05, 0.25);
  downs.filter(inR(6, 9.2)).forEach((d) => KIT.punch(tl, "#f14-calU .k-cal", d, 1.05, 0.3));

  /* ============ SUNDAY — "No needless cruelty to Claude, so say please, and say it twice" ============ */
  tl.set("#f14-sU", { opacity: 0 }, 9.14);
  tl.set(["#f14-bgK", "#f14-fgK"], { opacity: 1 }, 9.14);
  KIT.flash(tl, "#f14-flash", 9.14, 0.5, 0.2);
  tl.set("#f14-sun", { rotation: 0 }, 0);
  tl.to("#f14-sun", { rotation: 40, duration: 13.7 - 9.14, ease: "none" }, 9.14);
  pop("#f14-sunpill", 9.16, { s0: 0.4, r0: -8, r1: -3 });
  tl.set("#f14-sunpill", { opacity: 0 }, 0);
  // words slam one by one
  [["#f14-cw1", 9.2], ["#f14-cw2", 9.52], ["#f14-cw3", 9.96]].forEach((w, i) => {
    tl.set(w[0], { opacity: 1, scale: 2.4, y: -30 }, w[1]);
    tl.to(w[0], { scale: 1, y: 0, duration: 0.2, ease: "back.out(2.4)" }, w[1] + 0.001);
    KIT.shake(tl, "#f14-cam", w[1] + 0.02, 8 + i * 4, 0.18, 30 + i);
  });
  // ... then they shrink up to make room for CLAWD
  tl.to("#f14-cru", { scale: 0.42, y: -232, duration: 0.3, ease: "power3.inOut" }, 10.36);
  pop("#f14-clname", 10.66, { s0: 0.3, r0: -10, r1: -2 });
  // star halo behind CLAWD: pops on "Claude", turns slowly, pulses with every hop
  // a gentle stage for "no needless cruelty": spotlight on CLAWD's platform, the halo turning, hearts floating up
  tl.set("#f14-beam", { opacity: 0 }, 0);
  tl.to("#f14-beam", { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.14);
  tl.set("#f14-halo", { opacity: 1, scale: 0.4, rotation: -30, transformOrigin: "50% 50%" }, 9.15);
  tl.to("#f14-halo", { scale: 0.86, rotation: 0, duration: 0.45, ease: "back.out(1.6)" }, 9.151);
  tl.to("#f14-halo", { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 10.6);
  tl.set("#f14-halo svg", { rotation: 0, transformOrigin: "50% 50%" }, 0);
  tl.to("#f14-halo svg", { rotation: 40, duration: 13.7 - 9.32, ease: "none" }, 9.32);
  [11.44, 11.95, 12.36, 12.88].forEach((b) => KIT.punch(tl, "#f14-halo", b, 1.08, 0.3));
  (function () {
    const r = KIT.rng(1414);
    for (let i = 0; i < 9; i++) {
      const t = 9.16 + i * 0.14, x = 700 + r() * 520, el = "#f14-gh" + i;
      tl.set(el, { opacity: 0, x: x, y: 760, scale: 0.5 + r() * 0.5, rotation: (r() - 0.5) * 30 }, t);
      tl.to(el, { opacity: 1, duration: 0.2 }, t + 0.001);
      tl.to(el, { y: 300 + r() * 140, x: x + (r() - 0.5) * 160, duration: 1.4, ease: "sine.out" }, t + 0.001);
      tl.to(el, { opacity: 0, duration: 0.3 }, t + 1.15);
    }
  })();
  // "please" — bubble 1 + hearts
  pop("#f14-b1", 11.42, { s0: 0.2, r0: -14, r1: -4, d: 0.24 });
  pop("#f14-b2", 12.86, { s0: 0.2, r0: 14, r1: 4, d: 0.24 });
  pop("#f14-x2", 12.9, { s0: 0.2, r0: -40, r1: 10, d: 0.3 });
  const burst = (t, cx, cy, from, n, seed) => {
    const r = KIT.rng(seed);
    for (let k = 0; k < n; k++) {
      const el = "#f14-h" + (from + k), a = -Math.PI * 0.85 + (k / (n - 1)) * Math.PI * 0.7 + (r() - 0.5) * 0.2, d = 130 + r() * 120;
      tl.set(el, { opacity: 1, x: cx - 42, y: cy - 38, scale: 0.3, rotation: (r() - 0.5) * 40 }, t);
      tl.to(el, { x: cx - 42 + Math.cos(a) * d, y: cy - 38 + Math.sin(a) * d * 0.8, scale: 0.75 + r() * 0.5, duration: 0.55, ease: "power3.out" }, t + 0.001);
      tl.to(el, { y: cy - 38 + Math.sin(a) * d * 0.8 - 60, opacity: 0, duration: 0.5, ease: "power1.in" }, t + 0.7 + r() * 0.25);
    }
  };
  burst(11.46, 960, 480, 0, 8, 51);
  burst(12.9, 960, 470, 8, 9, 77);
  burst(13.2, 960, 480, 17, 5, 91);
  // bubbles breathe on the beat
  beats.filter(inR(11.7, 13.7)).forEach((b) => KIT.punch(tl, "#f14-b1", b, 1.04, 0.25));
  beats.filter(inR(13.0, 13.7)).forEach((b) => KIT.punch(tl, "#f14-b2", b, 1.04, 0.25));
  // hold through the stop, gentle push into the cut
  tl.to("#f14-cam", { scale: 1.05, duration: 0.6, ease: "power2.in" }, 13.08);
})();
</script>

<script type="module">
  import * as K3 from "./assets/kit/kit3d.js";
  const { THREE } = K3;
  const tl = window.__timelines["14-sat-sun"];
  const T0 = 159.939, T1 = 173.639;
  const beats = KIT.beatsIn(T0, T1);
  const W = K3.setup(document.getElementById("f14-gl"), { w: 1920, h: 1080, fov: 30, cam: [0, 0, 30] });

  /* --- EMERGENCY BRAKE lever (Saturday) --- */
  // wall-mounted on the hazard plate (plate centre = screen 1640,596); swings in the screen plane
  const lever = new THREE.Group();
  const bracket = K3.box(2.1, 2.1, 0.7, 0x30303f, { outline: 0.09 }); lever.add(bracket);
  const bolt = (x, y) => { const b = K3.cyl(0.16, 0.16, 0.2, "off", { outline: 0.04 }); b.rotation.x = Math.PI / 2; b.position.set(x, y, 0.42); lever.add(b); };
  bolt(-0.72, 0.72); bolt(0.72, 0.72); bolt(-0.72, -0.72); bolt(0.72, -0.72);
  const pivot = new THREE.Group(); pivot.position.z = 0.75; lever.add(pivot);
  const hub = K3.cyl(0.66, 0.66, 0.8, "yellow", { outline: 0.07 }); hub.rotation.x = Math.PI / 2; pivot.add(hub);
  const arm = K3.cyl(0.25, 0.3, 3.3, "off", { outline: 0.08 }); arm.position.y = 1.95; pivot.add(arm);
  const grip = K3.cyl(0.4, 0.4, 0.95, 0x30303f, { outline: 0.07 }); grip.position.y = 3.25; pivot.add(grip);
  const knob = K3.sphere(0.88, "red", { outline: 0.09 }); knob.position.y = 4.1; pivot.add(knob);
  lever.position.set(10.13, -0.83, 0);
  lever.rotation.set(0.08, 0.05, 0);
  W.scene.add(lever);

  /* --- CLAWD (Sunday) --- */
  const cl = K3.clawd({ scale: 0.98 });
  W.scene.add(cl.group);
  const FLOOR = -3.28; // platform top at about screen y 760
  // CLAWD's stage platform with a trapdoor he pops out of
  const plat = new THREE.Group(); W.scene.add(plat);
  const pTop = K3.cyl(3.7, 3.8, 0.55, "cream", { outline: 0.09, seg: 48 }); pTop.position.y = -0.275; plat.add(pTop);
  const pBase = K3.cyl(4.0, 4.1, 0.55, "pink", { outline: 0.09, seg: 48 }); pBase.position.y = -0.82; plat.add(pBase);
  const trap = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.04, 40), K3.flat(0x15151a)); trap.position.y = 0.03; plat.add(trap);

  const clamp = (x) => Math.max(0, Math.min(1, x));
  const backOut = (p, s = 1.9) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
  const UP = -0.62, DOWN = 2.05;
  // hops ride the beat grid (11.33 · 11.87 · 12.42), the big one spins on "twice", then a settle hop into the cut
  // take-off ON the words: "please" 11.44 and "twice" 12.88 (with a spin); smaller beat hops between
  const hops = [[11.44, 0.46, 1.9], [11.95, 0.36, 0.9], [12.36, 0.34, 0.8], [12.88, 0.56, 2.4, true], [13.48, 0.24, 0.5]];
  // heart mesh (extruded toon heart with outline)
  const hs = new THREE.Shape();
  hs.moveTo(0, -1); hs.bezierCurveTo(-0.2, -0.75, -1, -0.3, -1, 0.25); hs.bezierCurveTo(-1, 0.8, -0.35, 1.05, 0, 0.6);
  hs.bezierCurveTo(0.35, 1.05, 1, 0.8, 1, 0.25); hs.bezierCurveTo(1, -0.3, 0.2, -0.75, 0, -1);
  const hg = new THREE.ExtrudeGeometry(hs, { depth: 0.38, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.06, bevelSegments: 2, curveSegments: 10 });
  hg.center();
  const hearts = [[11.4, -1.8, -0.6, 1], [11.48, 1.6, 0.7, 0.85], [11.93, 0.3, 0.3, 0.9], [12.48, -0.9, -0.5, 0.8], [12.92, -2.6, -1, 1.1],
    [12.98, 0.1, 0.1, 1.2], [13.04, 2.5, 1, 1.05], [13.46, -1.3, -0.4, 0.8], [13.52, 1.4, 0.5, 0.75]].map((d, i) => {
    const mesh = K3.solid(hg, i % 4 === 3 ? "red" : "pink", { outline: 0.07 });
    mesh.visible = false; W.scene.add(mesh);
    return { mesh, t0: d[0], x: d[1], dx: d[2], s: d[3] };
  });

  KIT.onFrame(tl, (t) => {
    /* lever */
    lever.visible = t < 5.62;
    if (lever.visible) {
      let a = UP;
      if (t < 2.17) {
        for (const b of beats) { const d = t - b; if (d >= 0 && d < 0.4 && b < 2.1) a += 0.05 * Math.sin(d * 24) * (1 - d / 0.4); }
      } else if (t < 2.42) {
        a = UP + (DOWN - UP) * backOut(clamp((t - 2.17) / 0.25));
      } else {
        const d = t - 2.42; a = DOWN + 0.07 * Math.sin(d * 34) * Math.exp(-d * 7);
      }
      pivot.rotation.z = a;
      const sq = t >= 2.2 && t < 2.5 ? 1 - (t - 2.2) / 0.3 : 0;
      lever.scale.set(1 + sq * 0.07, 1 + sq * 0.07, 1);
    }
    /* clawd — the star of "be nice": rises on "Claude", waves, hops on every beat, spins on "twice", pops 3D hearts */
    // platform glides up into place for "no needless cruelty"; trapdoor opens just before "Claude"
    plat.visible = t >= 9.12;
    const pu = clamp((t - 9.12) / 0.4);
    plat.position.y = FLOOR - 7 * Math.pow(1 - pu, 3);
    const tu = t < 10.6 ? clamp((t - 10.36) / 0.14) : 1 - clamp((t - 10.8) / 0.14);
    trap.scale.set(Math.max(0.001, tu), 1, Math.max(0.001, tu)); trap.visible = tu > 0.01;
    const rise = clamp((t - 10.5) / 0.4);
    cl.group.visible = t >= 10.5;
    if (cl.group.visible) {
      cl.group.position.set(0, FLOOR + 4.2 * rise * (1 - rise) * 1.3, 0);
      let hy = 0, hu = -1, spin = 0;
      for (const h of hops) {
        const u = (t - h[0]) / h[1];
        if (u >= 0 && u < 1) { hy = Math.max(hy, 4 * h[2] * u * (1 - u)); hu = u; if (h[3]) spin = Math.PI * 2 * (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2); }
      }
      const twice = t > 12.84 && t < 13.5;
      cl.animate(t, {
        beat: [], bounce: 0,
        wave: t > 10.62 && t < 11.3 ? 1 : twice ? 1 : hu >= 0 ? 0.55 : 0,
        waveL: twice ? 1 : hu >= 0 ? 0.55 : 0,
        look: t < 11.3 ? 0 : t < 12.6 ? -0.8 : 0.8,
        squint: t > 11.3,
        blink: [10.95],
        turn: t < 11.3 ? -0.32 + 0.12 * Math.sin(t * 2.2) : t < 12.6 ? -0.42 : 0.42,
      });
      cl.rig.position.y += hy;
      cl.group.rotation.y += spin;
      cl.group.rotation.x = 0.16;
      cl.group.scale.setScalar(0.98 * Math.max(0.05, backOut(rise, 1.8)));
      // squash & stretch: crouch before take-off, stretch on the way up, squash on landing
      let sx = 1, sy = 1;
      for (const h of hops) {
        const u = (t - h[0]) / h[1], pre = (h[0] - t) / 0.12, post = (t - h[0] - h[1]) / 0.2, A = h[2] > 1.5 ? 1 : 0.6;
        if (pre > 0 && pre < 1) { sy = 1 - 0.24 * A * (1 - pre); sx = 1 + 0.14 * A * (1 - pre); }
        if (u >= 0 && u < 0.35) { sy = 1 + 0.18 * A * (1 - u / 0.35); sx = 1 - 0.08 * A * (1 - u / 0.35); }
        if (post >= 0 && post < 1) { sy = 1 - 0.22 * A * (1 - post); sx = 1 + 0.14 * A * (1 - post); }
      }
      if (t >= 10.9 && t < 11.1) { const land = clamp((t - 10.9) / 0.2); sy = 1 - 0.2 * (1 - land); sx = 1 + 0.12 * (1 - land); }
      cl.rig.scale.set(sx, sy, 1);
    }
    /* 3D hearts popping off Clawd */
    hearts.forEach((h) => {
      const u = (t - h.t0) / 1.15;
      h.mesh.visible = u >= 0 && u < 1;
      if (!h.mesh.visible) return;
      const e = 1 - Math.pow(1 - u, 2);
      const sc = 0.62 * h.s * (u < 0.14 ? backOut(u / 0.14, 2.6) : u > 0.78 ? 1 - (u - 0.78) / 0.22 : 1);
      h.mesh.scale.setScalar(Math.max(0.001, sc));
      h.mesh.position.set(h.x + Math.sin(u * 7 + h.x) * 0.45 + h.dx * e, FLOOR + 4.4 + e * 3.6, 1.6);
      h.mesh.rotation.set(0, Math.sin(u * 6 + h.x) * 0.7, h.dx * -0.12);
    });
    W.render();
  });
</script>
</template>
