name: Retry renders (cron)

# Vercel Hobby only allows daily crons, so the hourly queue runner is
# triggered from here. Requires repository secrets APP_URL and CRON_SECRET.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: retry-renders-cron
  cancel-in-progress: false

jobs:
  retry:
    name: Call /api/cron/retry-renders
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Trigger retry endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets are required"
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/retry-renders")
          echo "HTTP $status"
          cat response.json
          [ "$status" = "200" ]
