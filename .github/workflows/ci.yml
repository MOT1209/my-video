name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node's install script downloads the optional CUDA/TensorRT
  # libraries from NuGet on linux/x64; that download intermittently times out
  # on GitHub runners and fails `npm ci`. The CPU binaries ship inside the npm
  # package, so tests don't need it. Release builds (release.yml) are unchanged.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test-and-typecheck:
    name: Test & Typecheck
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: King_Browser
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: King_Browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application and Electron bundles
        run: npm run build

      - name: Run automated test suite
        run: npm test

  website-build:
    name: Website Build & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: King_Browser
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Build website bundle
        run: npm --prefix website run build

      - name: Run website regression tests
        run: npm --prefix website test
