name: My Video Root App CI

on:
  push:
    branches:
      - main
      - 'phase-5/**'
      - 'fix/my-video-production-hardening'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: my-video-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-app:
    name: Root Next.js app (lint, tests, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint root app
        run: npx eslint src/app src/lib src/helpers types scripts

      - name: Test root app
        run: bun test src/lib types

      - name: Typecheck root app
        run: npx tsc --noEmit

      - name: Build root app
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci
          UPSTASH_REDIS_REST_URL: https://ci.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-token
          GEMINI_API_KEY: ci-only-placeholder
          CRON_SECRET: ci-only-placeholder
